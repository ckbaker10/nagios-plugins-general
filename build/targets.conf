# Build matrix: one line per target OS.
#
#   TARGET  IMAGE  ARCH=PLATFORM...
#
# ARCH is the suffix of the tarball name (see docs/PLATFORMS.md), PLATFORM the
# container platform; non-native platforms run under QEMU user emulation.
# Images starting with localhost/ are created by build/raspios-image.sh.

el8         docker.io/library/rockylinux:8                  x86_64=linux/amd64 aarch64=linux/arm64
el9         docker.io/library/rockylinux:9                  x86_64=linux/amd64 aarch64=linux/arm64
el10        quay.io/rockylinux/rockylinux:10                x86_64=linux/amd64 aarch64=linux/arm64
# openSUSE Leap is binary compatible with SLES of the same version
sles15      registry.opensuse.org/opensuse/leap:15.6        x86_64=linux/amd64 aarch64=linux/arm64
sles16      registry.opensuse.org/opensuse/leap:16.0        x86_64=linux/amd64 aarch64=linux/arm64
debian12    docker.io/library/debian:12                     x86_64=linux/amd64 aarch64=linux/arm64 armhf=linux/arm/v7
debian13    docker.io/library/debian:13                     x86_64=linux/amd64 aarch64=linux/arm64 armhf=linux/arm/v7
ubuntu2204  docker.io/library/ubuntu:22.04                  x86_64=linux/amd64 aarch64=linux/arm64 armhf=linux/arm/v7
ubuntu2404  docker.io/library/ubuntu:24.04                  x86_64=linux/amd64 aarch64=linux/arm64 armhf=linux/arm/v7
ubuntu2604  docker.io/library/ubuntu:26.04                  x86_64=linux/amd64 aarch64=linux/arm64 armhf=linux/arm/v7
# Raspberry Pi OS 32-bit (Raspbian, ARMv6 hard-float): runs on every Raspberry Pi
raspios12   localhost/raspios:bookworm                      armv6hf=linux/arm/v6
raspios13   localhost/raspios:trixie                        armv6hf=linux/arm/v6
