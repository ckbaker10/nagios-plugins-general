---
# tasks file for deploy-nagios-checks
# Deploys the prebuilt nagios-plugins tarball (build/build.sh) matching the
# target OS. Nothing is compiled on the hosts.

- name: Determine build target
  ansible.builtin.set_fact:
    nagios_plugins_target: >-
      {{ nagios_plugins_targets[ansible_facts['distribution'] ~ '-'
         ~ ansible_facts['distribution_major_version']] | default('') }}

- name: Fail on unsupported distribution
  ansible.builtin.fail:
    msg: >-
      No nagios-plugins build for {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }}. Add a target to
      build/build.sh and nagios_plugins_targets.
  when: nagios_plugins_target | length == 0

- name: Set tarball name
  ansible.builtin.set_fact:
    nagios_plugins_tarball: >-
      nagios-plugins-{{ nagios_plugins_version }}-{{ nagios_plugins_target }}-{{ ansible_facts['architecture'] }}.tar.gz

- name: Read tarball checksum on controller
  ansible.builtin.set_fact:
    nagios_plugins_sha256: >-
      {{ lookup('ansible.builtin.file', nagios_plugins_dist_dir ~ '/' ~ nagios_plugins_tarball ~ '.sha256').split()[0] }}

- name: Install runtime dependencies
  ansible.builtin.package:
    name: "{{ nagios_plugins_runtime_packages[nagios_plugins_target] }}"
    state: present

- name: Copy tarball to host
  ansible.builtin.copy:
    src: "{{ nagios_plugins_dist_dir }}/{{ nagios_plugins_tarball }}"
    dest: "{{ nagios_plugins_tmp_dir }}/{{ nagios_plugins_tarball }}"
    mode: '0644'
  register: nagios_plugins_copy

- name: Checksum tarball on host
  ansible.builtin.stat:
    path: "{{ nagios_plugins_tmp_dir }}/{{ nagios_plugins_tarball }}"
    checksum_algorithm: sha256
  register: nagios_plugins_tarball_stat

- name: Verify tarball checksum
  ansible.builtin.assert:
    that: nagios_plugins_tarball_stat.stat.checksum == nagios_plugins_sha256
    fail_msg: "SHA-256 mismatch for {{ nagios_plugins_tarball }}"
    quiet: true

- name: Check installed build
  ansible.builtin.stat:
    path: "{{ nagios_plugins_install_prefix }}/BUILDINFO"
  register: nagios_plugins_buildinfo

- name: Remove previous installation
  ansible.builtin.file:
    path: "{{ nagios_plugins_install_prefix }}"
    state: absent
  when: nagios_plugins_copy is changed

- name: Unpack nagios plugins
  ansible.builtin.unarchive:
    src: "{{ nagios_plugins_tmp_dir }}/{{ nagios_plugins_tarball }}"
    dest: /
    remote_src: true
  when: nagios_plugins_copy is changed or not nagios_plugins_buildinfo.stat.exists

- name: Verify installation
  ansible.builtin.command:
    cmd: "{{ nagios_plugins_install_prefix }}/libexec/check_http -V"
  register: nagios_plugins_verify
  changed_when: false

- name: Display installation summary
  ansible.builtin.debug:
    msg:
      - "{{ nagios_plugins_verify.stdout }}"
      - "Build: {{ nagios_plugins_tarball }} ({{ nagios_plugins_sha256 }})"
      - "Plugin directory: {{ nagios_plugins_install_prefix }}/libexec"
