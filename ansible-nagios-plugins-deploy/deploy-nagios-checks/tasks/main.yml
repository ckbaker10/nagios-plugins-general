---
# tasks file for deploy-nagios-checks
# Downloads the prebuilt nagios-plugins tarball (build/build.sh) matching the
# target OS from the GitHub release. Nothing is compiled on the hosts.

- name: Determine build target
  ansible.builtin.include_tasks: detect.yml

# EPEL provides fping and the Perl modules (Net::SNMP, Crypt::X509, ...)
- name: Enable EPEL (Rocky/Alma)
  ansible.builtin.package:
    name: epel-release
    state: present
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'RedHat'

- name: Enable EPEL (RHEL)
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    disable_gpg_check: true
    state: present
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['distribution'] == 'RedHat'

# EPEL packages depend on CRB (EL9+) / PowerTools (EL8), e.g. perl-Net-SNMP
# needs perl-Digest-SHA1 on EL8
- name: Set CRB repository name
  ansible.builtin.set_fact:
    nagios_plugins_crb_repo: >-
      {{ ('codeready-builder-for-rhel-' ~ ansible_facts['distribution_major_version']
          ~ '-' ~ ansible_facts['architecture'] ~ '-rpms')
         if ansible_facts['distribution'] == 'RedHat'
         else ('powertools' if ansible_facts['distribution_major_version'] == '8' else 'crb') }}
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['os_family'] == 'RedHat'

- name: Check enabled repositories
  ansible.builtin.command:
    cmd: dnf repolist --enabled
  register: nagios_plugins_repolist
  changed_when: false
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['os_family'] == 'RedHat'

- name: Install dnf config-manager
  ansible.builtin.package:
    name: dnf-plugins-core
    state: present
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'RedHat'

- name: Enable CRB / PowerTools (Rocky/Alma)
  ansible.builtin.command:
    cmd: "dnf config-manager --set-enabled {{ nagios_plugins_crb_repo }}"
  changed_when: true
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['distribution'] != 'RedHat'
    - nagios_plugins_crb_repo not in nagios_plugins_repolist.stdout

- name: Enable CodeReady Builder (RHEL)
  ansible.builtin.command:
    cmd: "subscription-manager repos --enable {{ nagios_plugins_crb_repo }}"
  changed_when: true
  when:
    - nagios_plugins_enable_epel
    - ansible_facts['distribution'] == 'RedHat'
    - nagios_plugins_crb_repo not in nagios_plugins_repolist.stdout

# tar/gzip for unpacking; everything else comes from RUNTIME-PACKAGES
- name: Install unpack tools
  ansible.builtin.package:
    name: [tar, gzip]
    state: present
  when: ansible_facts['os_family'] != 'Suse'

- name: Install unpack tools (SUSE)
  community.general.zypper:
    name: [tar, gzip]
    state: present
  when: ansible_facts['os_family'] == 'Suse'

- name: Download tarball from GitHub release
  ansible.builtin.get_url:
    url: "{{ nagios_plugins_release_url }}/{{ nagios_plugins_tarball }}"
    dest: "{{ nagios_plugins_tmp_dir }}/{{ nagios_plugins_tarball }}"
    checksum: "sha256:{{ nagios_plugins_release_url }}/{{ nagios_plugins_tarball }}.sha256"
    mode: '0644'
  register: nagios_plugins_copy

- name: Check installed build
  ansible.builtin.stat:
    path: "{{ nagios_plugins_install_prefix }}/BUILDINFO"
  register: nagios_plugins_buildinfo

- name: Remove previous installation
  ansible.builtin.file:
    path: "{{ nagios_plugins_install_prefix }}"
    state: absent
  when: nagios_plugins_copy is changed

- name: Unpack nagios plugins
  ansible.builtin.unarchive:
    src: "{{ nagios_plugins_tmp_dir }}/{{ nagios_plugins_tarball }}"
    dest: /
    remote_src: true
  when: nagios_plugins_copy is changed or not nagios_plugins_buildinfo.stat.exists

# Written by build/container-build.sh: owners of the linked libraries plus
# helper programs and Perl modules
- name: Read runtime package list
  ansible.builtin.slurp:
    src: "{{ nagios_plugins_install_prefix }}/RUNTIME-PACKAGES"
  register: nagios_plugins_runtime_file

- name: Set runtime package list
  ansible.builtin.set_fact:
    nagios_plugins_runtime: >-
      {{ (nagios_plugins_runtime_file.content | b64decode).split()
         + nagios_plugins_extra_packages }}

- name: Install runtime dependencies
  ansible.builtin.package:
    name: "{{ nagios_plugins_runtime }}"
    state: present
  when: ansible_facts['os_family'] != 'Suse'

# ansible-core has no zypper backend for the generic package module
- name: Install runtime dependencies (SUSE)
  community.general.zypper:
    name: "{{ nagios_plugins_runtime }}"
    state: present
  when: ansible_facts['os_family'] == 'Suse'

# Versions are installed side by side; the CheckCommands use the stable link,
# so switching nagios_plugins_version (upgrade or rollback) needs no Icinga
# change. Older versions stay installed for rollback.
- name: Point {{ nagios_plugins_link }} to {{ nagios_plugins_version }}
  ansible.builtin.file:
    src: "{{ nagios_plugins_install_prefix }}"
    dest: "{{ nagios_plugins_link }}"
    state: link
    force: true

- name: Verify installation
  ansible.builtin.command:
    cmd: "{{ nagios_plugins_link }}/libexec/check_http -V"
  register: nagios_plugins_verify
  changed_when: false

- name: Display installation summary
  ansible.builtin.debug:
    msg:
      - "{{ nagios_plugins_verify.stdout }}"
      - "Host: {{ nagios_plugins_os_desc }}"
      - "Build: {{ nagios_plugins_release_url }}/{{ nagios_plugins_tarball }}"
      - "Plugin directory: {{ nagios_plugins_link }}/libexec -> {{ nagios_plugins_install_prefix }}"
